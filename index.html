  <script>
    const STORAGE_KEY = 'pocketledger_data_v1';

    const defaultSeedData = {
      categories: {
        expense: ['Fuel & Commute', 'Groceries & Food', 'Utilities & Bills', 'Maintenance & Repairs', 'Shopping & Personal', 'Investments', 'Interest / Return', 'General'],
        income: ['Salary & Wages', 'Investment Inflow/Return', 'General']
      },
      accounts: [
        { id: 'acc_1', name: 'Primary Bank (HDFC)', type: 'debit_bank', balance: 48500 },
        { id: 'acc_2', name: 'Cash in Hand', type: 'debit_cash', balance: 6400 },
        { id: 'acc_3', name: 'Amazon ICICI Credit Card', type: 'credit_card', limit: 100000, currentDue: 14200, statementBalance: 14200, billGenDay: 1, dueDay: 18, lastBilledMonth: '', lastPaidMonth: '' }
      ],
      transactions: [
        { id: 'tx_1', type: 'income', amount: 65000, category: 'Salary & Wages', accountId: 'acc_1', date: new Date().toISOString().slice(0, 10), notes: 'Monthly Salary' }
      ],
      khata: [],
      loans: [],
      investments: [],
      insurances: [],
      bills: [],
      dismissedAlerts: {}
    };

    function getOffsetDate(daysAhead) {
      const d = new Date();
      d.setDate(d.getDate() + daysAhead);
      return d.toISOString().slice(0, 10);
    }
    
    function getLocalISOString() {
      const dateObj = new Date();
      const tzOffset = dateObj.getTimezoneOffset() * 60000;
      return new Date(dateObj.getTime() - tzOffset).toISOString().slice(0, 10);
    }
    
    // SAFE RENDER ICONS - PREVENTS CRASH IF OFFLINE
    function renderIcons() {
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    }

    let appData = loadData();
    let currentViewingContact = null;
    let txRenderLimit = 20;
    let txChartInstance = null;
    let pendingPayment = null;
    let toastTimeout = null;
    let importMode = 'merge'; 

    function showToast(message) {
      const toast = document.getElementById('toastNotification');
      document.getElementById('toastMsg').innerText = message;
      toast.classList.remove('-translate-y-24', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-24', 'opacity-0');
      }, 2500);
    }

    function loadData() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          if (!parsed.investments) parsed.investments = [];
          if (!parsed.insurances) parsed.insurances = [];
          if (!parsed.bills) parsed.bills = [];
          if (!parsed.dismissedAlerts) parsed.dismissedAlerts = {};
          if (!parsed.categories) parsed.categories = defaultSeedData.categories;
          
          if (parsed.accounts) {
            parsed.accounts.forEach(acc => {
              if (acc.type === 'credit_card') {
                if (acc.lastPaidMonth === undefined) acc.lastPaidMonth = '';
                if (acc.billGenDay === undefined) acc.billGenDay = 1;
                if (acc.statementBalance === undefined) acc.statementBalance = acc.currentDue || 0;
                if (acc.lastBilledMonth === undefined) acc.lastBilledMonth = '';
              }
            });
          }
          return parsed;
        }
      } catch (e) {
        console.error("Failed to load local data:", e);
      }
      return JSON.parse(JSON.stringify(defaultSeedData));
    }

    function saveData(silent = false) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        refreshAllViews();
        if(!silent) showToast('Changes saved successfully');
      } catch (e) {
        console.error("Storage error:", e);
      }
    }

    function checkCreditCardBills() {
      const today = new Date();
      const currentMonthKey = today.toISOString().slice(0, 7);
      const currentDay = today.getDate();
      let changed = false;
      
      appData.accounts.forEach(acc => {
        if (acc.type === 'credit_card') {
          if (currentDay >= acc.billGenDay && acc.lastBilledMonth !== currentMonthKey) {
             acc.statementBalance = acc.currentDue; 
             acc.lastBilledMonth = currentMonthKey;
             acc.lastPaidMonth = ''; 
             changed = true;
          }
        }
      });
      if (changed) localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    let currentTab = 'dashboard';
    let khataFilter = 'all';
    let currentTxType = 'expense';
    let currentKhataDirection = 'lent';

    function switchTab(tabName) {
      currentTab = tabName;
      ['dashboard', 'transactions', 'khata', 'loans', 'assets', 'accounts', 'bills'].forEach(tab => {
        const viewEl = document.getElementById(`view-${tab}`);
        const navEl = document.getElementById(`nav-${tab}`);
        if (viewEl) {
          if (tab === tabName) viewEl.classList.remove('hidden');
          else viewEl.classList.add('hidden');
        }
        if (navEl) {
          if (tab === tabName) { navEl.classList.add('text-emerald-400'); navEl.classList.remove('text-slate-400'); } 
          else { navEl.classList.remove('text-emerald-400'); navEl.classList.add('text-slate-400'); }
        }
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
      refreshAllViews();
    }

    function dismissReminder(id) {
      const currentMonthKey = new Date().toISOString().slice(0, 7);
      if (!appData.dismissedAlerts) appData.dismissedAlerts = {};
      appData.dismissedAlerts[id] = currentMonthKey;
      saveData(true);
      showToast('Reminder dismissed');
    }

    function computeReminders() {
      const today = new Date();
      const currentDay = today.getDate();
      const currentMonth = today.getMonth();
      const currentYear = today.getFullYear();
      const currentMonthKey = today.toISOString().slice(0, 7);
      const reminders = [];

      appData.loans.forEach(loan => {
        if(!loan.dueDay || loan.principalBalance <= 0) return; 
        if(loan.lastPaidMonth === currentMonthKey) return; 
        if(appData.dismissedAlerts && appData.dismissedAlerts[loan.id] === currentMonthKey) return;

        let diffDays = loan.dueDay - currentDay;
        let status = diffDays === 0 ? 'today' : (diffDays < 0 ? 'overdue' : (diffDays <= 7 ? 'soon' : 'upcoming'));
        reminders.push({ id: loan.id, type: 'EMI', title: `${loan.name} EMI`, amount: loan.emiAmount, dueDayText: `Due on ${loan.dueDay}th of this month`, status: status, targetDate: new Date(currentYear, currentMonth, loan.dueDay), raw: loan });
      });

      appData.accounts.filter(a => a.type === 'credit_card' && Number(a.statementBalance || 0) > 0).forEach(card => {
        if(!card.dueDay || card.lastPaidMonth === currentMonthKey) return; 
        if(appData.dismissedAlerts && appData.dismissedAlerts[card.id] === currentMonthKey) return;

        let diffDays = card.dueDay - currentDay;
        let status = diffDays === 0 ? 'today' : (diffDays < 0 ? 'overdue' : (diffDays <= 7 ? 'soon' : 'upcoming'));
        reminders.push({ id: card.id, type: 'Statement Due', title: `${card.name}`, amount: card.statementBalance, dueDayText: `Due on ${card.dueDay}th of this month`, status: status, targetDate: new Date(currentYear, currentMonth, card.dueDay), raw: card });
      });

      appData.bills.forEach(bill => {
        if (!bill.dueDay || bill.lastPaidMonth === currentMonthKey) return;
        if (appData.dismissedAlerts && appData.dismissedAlerts[bill.id] === currentMonthKey) return;

        let diffDays = bill.dueDay - currentDay;
        let status = diffDays === 0 ? 'today' : (diffDays < 0 ? 'overdue' : (diffDays <= 7 ? 'soon' : 'upcoming'));
        reminders.push({ id: bill.id, type: 'Monthly Bill', title: bill.title, amount: bill.amount, dueDayText: `Due on ${bill.dueDay}th of this month`, status: status, targetDate: new Date(currentYear, currentMonth, bill.dueDay), raw: bill });
      });

      appData.investments.filter(i => i.installmentAmount > 0 && i.lastPaidMonth !== currentMonthKey).forEach(inv => {
        if(!inv.dueDay) return;
        if(appData.dismissedAlerts && appData.dismissedAlerts[inv.id] === currentMonthKey) return;
        let diffDays = inv.dueDay - currentDay;
        let status = diffDays === 0 ? 'today' : (diffDays < 0 ? 'overdue' : (diffDays <= 7 ? 'soon' : 'upcoming'));
        reminders.push({ id: inv.id, type: 'SIP/RD Due', title: `${inv.name} Installment`, amount: inv.installmentAmount, dueDayText: `Due on ${inv.dueDay}th of this month`, status: status, targetDate: new Date(currentYear, currentMonth, inv.dueDay), raw: inv });
      });

      const aggregatedContacts = getAggregatedContacts();
      aggregatedContacts.forEach(contact => {
        if (contact.netBalance === 0) return;
        const entryWithDueDate = [...contact.entries].reverse().find(e => e.dueDate);
        if (!entryWithDueDate) return;
        
        const dueDateStr = entryWithDueDate.dueDate;
        if (!dueDateStr) return; 
        
        const aggId = 'khata_agg_' + contact.name;
        if (appData.dismissedAlerts && appData.dismissedAlerts[aggId] === currentMonthKey) return;

        const dayDiff = Math.round((new Date(dueDateStr).setHours(0,0,0,0) - today.setHours(0,0,0,0)) / (1000 * 60 * 60 * 24));
        let status = dayDiff === 0 ? 'today' : (dayDiff < 0 ? 'overdue' : (dayDiff <= 7 ? 'soon' : 'upcoming'));
        
        let title = contact.netBalance < 0 ? `${contact.name} (Collect Cash)` : `${contact.name} (Return Cash)`;
        let type = contact.netBalance < 0 ? 'Cash Collection' : 'Cash Return';

        reminders.push({ id: aggId, type: type, title: title, amount: Math.abs(contact.netBalance), dueDayText: `Due on ${dueDateStr}`, status: status, targetDate: new Date(dueDateStr), raw: contact });
      });
      
      appData.insurances.forEach(ins => {
        if(!ins.dueDate) return;
        if(appData.dismissedAlerts && appData.dismissedAlerts[ins.id] === currentMonthKey) return;

        const dayDiff = Math.round((new Date(ins.dueDate).setHours(0,0,0,0) - today.setHours(0,0,0,0)) / (1000 * 60 * 60 * 24));
        let status = dayDiff === 0 ? 'today' : (dayDiff < 0 ? 'overdue' : (dayDiff <= 14 ? 'soon' : 'upcoming'));
        reminders.push({ id: ins.id, type: 'Insurance Renewal', title: `${ins.name} Premium`, amount: ins.premium, dueDayText: `Due on ${ins.dueDate}`, status: status, targetDate: new Date(ins.dueDate), raw: ins });
      });

      const priority = { 'overdue': 1, 'today': 2, 'soon': 3, 'upcoming': 4 };
      reminders.sort((a, b) => (priority[a.status] || 99) - (priority[b.status] || 99));
      return reminders;
    }

    function generateCalendarLink(reminder) {
      if(!reminder.targetDate || isNaN(reminder.targetDate)) return "#";
      const dateStr = reminder.targetDate.toISOString().replace(/-|:|\.\d\d\d/g, '').slice(0, 8);
      const title = encodeURIComponent(`PocketLedger Reminder: ₹${reminder.amount} for ${reminder.title}`);
      const details = encodeURIComponent(`Payment reminder for ${reminder.type}. Amount: ₹${reminder.amount}. Set via PocketLedger.`);
      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dateStr}/${dateStr}&details=${details}&sf=true&output=xml`;
    }

    function renderRemindersUI() {
      const reminders = computeReminders();
      const badge = document.getElementById('headerReminderBadge');
      const urgentContainer = document.getElementById('urgentAlertContainer');
      const modalList = document.getElementById('remindersListContent');
      const urgentDues = reminders.filter(r => r.status === 'overdue' || r.status === 'today' || r.status === 'soon');

      if (urgentDues.length > 0) {
        badge.classList.remove('hidden');
        urgentContainer.classList.remove('hidden');
        const topAlert = urgentDues[0];
        let alertColor = 'from-rose-950/70 border-rose-800/60 text-rose-200';
        let badgeColor = 'bg-rose-500/20 text-rose-400 border border-rose-500/30';
        let label = 'OVERDUE';
        if (topAlert.status === 'today') {
          alertColor = 'from-amber-950/70 border-amber-800/60 text-amber-200';
          badgeColor = 'bg-amber-500/20 text-amber-400 border border-amber-500/30';
          label = 'DUE TODAY';
        } else if (topAlert.status === 'soon') {
          alertColor = 'from-sky-950/70 border-sky-800/60 text-sky-200';
          badgeColor = 'bg-sky-500/20 text-sky-400 border border-sky-500/30';
          label = 'DUE SOON';
        }
        urgentContainer.innerHTML = `
          <div class="action-toggle-reminders clickable cursor-pointer bg-gradient-to-r ${alertColor} bg-slate-900 border p-3 rounded-2xl flex items-center justify-between shadow-lg">
            <div class="flex items-center gap-2.5">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${badgeColor}">${label}</span>
              <div class="text-xs">
                <span class="font-bold text-white">${topAlert.title}</span>: ₹${topAlert.amount.toLocaleString('en-IN')}
              </div>
            </div>
            <span class="text-xs font-semibold text-emerald-400 flex items-center">
              ${urgentDues.length > 1 ? `+${urgentDues.length - 1} more` : 'Details'} <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
            </span>
          </div>
        `;
      } else {
        badge.classList.add('hidden');
        urgentContainer.classList.add('hidden');
      }

      if (reminders.length === 0) {
        modalList.innerHTML = `<div class="py-8 text-center text-slate-400 text-xs">No pending dues or upcoming reminders! You are all caught up.</div>`;
      } else {
        modalList.innerHTML = reminders.map(r => {
          let badgeHtml = '';
          if (r.status === 'overdue') badgeHtml = `<span class="bg-rose-500/20 text-rose-400 border border-rose-500/30 text-[10px] px-2 py-0.5 rounded-full font-bold">OVERDUE</span>`;
          else if (r.status === 'today') badgeHtml = `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] px-2 py-0.5 rounded-full font-bold">TODAY</span>`;
          else if (r.status === 'soon') badgeHtml = `<span class="bg-sky-500/20 text-sky-400 border border-sky-500/30 text-[10px] px-2 py-0.5 rounded-full font-bold">SOON</span>`;
          else badgeHtml = `<span class="bg-slate-700 text-slate-300 text-[10px] px-2 py-0.5 rounded-full font-medium">UPCOMING</span>`;
          return `
            <div class="bg-slate-800/80 border border-slate-700/60 p-3 rounded-xl flex items-start justify-between">
              <div>
                <div class="flex items-center gap-1.5 mb-1">${badgeHtml}<span class="text-[11px] text-slate-400">${r.type}</span></div>
                <h4 class="font-bold text-white text-sm">${r.title}</h4>
                <p class="text-xs text-slate-400 font-mono mt-0.5">${r.dueDayText}</p>
                <div class="text-emerald-400 font-bold text-sm mt-1">₹${r.amount.toLocaleString('en-IN')}</div>
              </div>
              <div class="flex flex-col items-end gap-2.5 h-full justify-between">
                <button class="action-dismiss-reminder text-slate-500 hover:text-white p-1 rounded transition" aria-label="Dismiss reminder" data-id="${r.id}" title="Dismiss this alert"><i data-lucide="x" class="w-4 h-4"></i></button>
                <a href="${generateCalendarLink(r)}" target="_blank" rel="noopener" class="flex flex-col items-center justify-center bg-slate-700 hover:bg-slate-650 px-2.5 py-1.5 rounded-xl text-[10px] font-semibold text-slate-200 border border-slate-600 transition">
                  <i data-lucide="calendar-plus" class="w-3 h-3 text-emerald-400 mb-0.5"></i> Sync
                </a>
              </div>
            </div>
          `;
        }).join('');
      }
      renderIcons();
    }

    function getAggregatedContacts() {
      const map = {};
      appData.khata.forEach(k => {
        const name = k.personName.trim();
        if (!map[name]) map[name] = { name: name, netBalance: 0, totalTook: 0, totalGave: 0, lastDate: k.date, entries: [] };
        const amt = Number(k.amount || 0);
        if (k.status !== 'settled') {
          if (k.direction === 'borrowed') { map[name].netBalance += amt; map[name].totalTook += amt; }
          else { map[name].netBalance -= amt; map[name].totalGave += amt; }
        }
        map[name].entries.push(k);
        if (new Date(k.date) > new Date(map[name].lastDate)) map[name].lastDate = k.date;
      });
      return Object.values(map);
    }
    
    function renderDashboardObligations() {
      const currentMonthKey = new Date().toISOString().slice(0, 7);
      
      let emiReq = appData.loans.filter(l => l.principalBalance > 0 && l.lastPaidMonth !== currentMonthKey).reduce((sum, l) => sum + Number(l.emiAmount), 0);
      let sipReq = appData.investments.filter(i => i.installmentAmount > 0 && i.lastPaidMonth !== currentMonthKey).reduce((sum, i) => sum + Number(i.installmentAmount), 0);
      let ccReq = appData.accounts.filter(a => a.type === 'credit_card' && (a.statementBalance || 0) > 0 && a.lastPaidMonth !== currentMonthKey).reduce((sum, a) => sum + Number(a.statementBalance), 0);
      let billsReq = appData.bills.filter(b => b.lastPaidMonth !== currentMonthKey).reduce((sum, b) => sum + Number(b.amount), 0);
      let insReq = appData.insurances.filter(i => i.dueDate && i.dueDate.startsWith(currentMonthKey)).reduce((sum, i) => sum + Number(i.premium), 0);
      
      let khataReq = 0;
      const aggregatedContacts = getAggregatedContacts();
      aggregatedContacts.forEach(contact => {
        if(contact.netBalance > 0) { 
           const entryWithDueDate = [...contact.entries].reverse().find(e => e.dueDate);
           if (entryWithDueDate && entryWithDueDate.dueDate.startsWith(currentMonthKey)) khataReq += contact.netBalance;
        }
      });
      
      const totalReq = emiReq + sipReq + ccReq + billsReq + insReq + khataReq;
      
      let liquidCash = appData.accounts.filter(a => a.type === 'debit_bank' || a.type === 'debit_cash').reduce((sum, a) => sum + Number(a.balance), 0);
      let shortageStatus = '';
      if (liquidCash >= totalReq) {
         let surplus = liquidCash - totalReq;
         shortageStatus = `<span class="text-[10px] text-emerald-400 font-bold bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">Sufficient (₹${surplus.toLocaleString('en-IN')} left)</span>`;
      } else {
         let shortage = totalReq - liquidCash;
         shortageStatus = `<span class="text-[10px] text-rose-400 font-bold bg-rose-500/10 px-2 py-0.5 rounded-full border border-rose-500/20 animate-pulse">Shortage: ₹${shortage.toLocaleString('en-IN')}</span>`;
      }

      document.getElementById('dashObligStatus').innerHTML = shortageStatus;
      document.getElementById('dashTotalObligations').innerText = `₹${totalReq.toLocaleString('en-IN')}`;
      document.getElementById('dashObligEmi').innerText = `₹${emiReq.toLocaleString('en-IN')}`;
      document.getElementById('dashObligSip').innerText = `₹${sipReq.toLocaleString('en-IN')}`;
      document.getElementById('dashObligCc').innerText = `₹${ccReq.toLocaleString('en-IN')}`;
      document.getElementById('dashObligBills').innerText = `₹${billsReq.toLocaleString('en-IN')}`;
      document.getElementById('dashObligIns').innerText = `₹${insReq.toLocaleString('en-IN')}`;
      document.getElementById('dashObligKhata').innerText = `₹${khataReq.toLocaleString('en-IN')}`;
    }

    function refreshAllViews() {
      let liquidCash = 0;
      let cardDues = 0;
      appData.accounts.forEach(acc => {
        if (acc.type === 'debit_bank' || acc.type === 'debit_cash') liquidCash += Number(acc.balance || 0);
        else if (acc.type === 'credit_card') cardDues += Number(acc.currentDue || 0);
      });
      document.getElementById('netWealthDisplay').innerText = `₹${(liquidCash - cardDues).toLocaleString('en-IN')}`;

      const currentMonthPrefix = new Date().toISOString().slice(0, 7);
      const currentMonthTx = appData.transactions.filter(t => t.date && t.date.startsWith(currentMonthPrefix));
      let monthInflow = 0, monthSpent = 0;
      currentMonthTx.forEach(t => {
        if (t.type === 'income') monthInflow += Number(t.amount || 0);
        if (t.type === 'expense') monthSpent += Number(t.amount || 0);
      });
      document.getElementById('monthInflowDisplay').innerText = `+₹${monthInflow.toLocaleString('en-IN')}`;
      document.getElementById('monthSpentDisplay').innerText = `-₹${monthSpent.toLocaleString('en-IN')}`;
      
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const now = new Date();
      document.getElementById('currentMonthYear').innerText = `${monthNames[now.getMonth()]} ${now.getFullYear()}`;

      let totalLent = 0, totalBorrowed = 0;
      getAggregatedContacts().forEach(c => {
        if (c.netBalance < 0) totalLent += Math.abs(c.netBalance); 
        if (c.netBalance > 0) totalBorrowed += c.netBalance;       
      });
      document.getElementById('totalToCollectDisplay').innerText = `₹${totalLent.toLocaleString('en-IN')}`;
      document.getElementById('totalToReturnDisplay').innerText = `₹${totalBorrowed.toLocaleString('en-IN')}`;

      let totalPrincipal = 0, totalEmi = 0;
      appData.loans.forEach(l => { totalPrincipal += Number(l.principalBalance || 0); totalEmi += Number(l.emiAmount || 0); });
      document.getElementById('totalLoanOutstandingDisplay').innerText = `₹${totalPrincipal.toLocaleString('en-IN')}`;
      document.getElementById('totalMonthlyEmiDisplay').innerText = `₹${totalEmi.toLocaleString('en-IN')}/mo`;

      let totalInvested = 0;
      appData.investments.forEach(i => totalInvested += Number(i.amount || 0));
      if (document.getElementById('dashTotalInvestmentsDisplay')) document.getElementById('dashTotalInvestmentsDisplay').innerText = `₹${totalInvested.toLocaleString('en-IN')}`;
      if (document.getElementById('dashTotalLoansDisplay')) document.getElementById('dashTotalLoansDisplay').innerText = `₹${totalPrincipal.toLocaleString('en-IN')}`;

      renderDashboardObligations();
      renderDashboardFeed(); 
      renderTransactions(); 
      renderKhata(); 
      renderLoans(); 
      renderAssets(); 
      renderAccounts(); 
      renderBills(); 
      renderRemindersUI();

      const selectAcc = document.getElementById('txAccount');
      if (selectAcc) selectAcc.innerHTML = appData.accounts.map(a => `<option value="${a.id}">${a.name} (${a.type === 'credit_card' ? 'Credit Card' : 'Debit'})</option>`).join('');
      renderIcons();
    }

    function renderDashboardFeed() {
      const recentTxContainer = document.getElementById('dashboardRecentTxList');
      const recentLoansContainer = document.getElementById('dashboardLoansList');
      const recentTx = [...appData.transactions].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 4);

      if (recentTx.length === 0) recentTxContainer.innerHTML = `<div class="p-4 text-center text-xs text-slate-500">No transactions recorded yet.</div>`;
      else recentTxContainer.innerHTML = recentTx.map(t => createTxRowHtml(t)).join('');

      if (appData.loans.length === 0) recentLoansContainer.innerHTML = `<div class="p-3 text-center text-xs text-slate-500">No active loans added.</div>`;
      else recentLoansContainer.innerHTML = appData.loans.slice(0, 2).map(loan => `
        <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-800/90 border border-slate-700/50">
          <div><h4 class="text-xs font-bold text-white">${loan.name}</h4><p class="text-[10px] text-slate-400">Due on ${loan.dueDay}th • EMI ₹${loan.emiAmount.toLocaleString('en-IN')}</p></div>
          ${loan.principalBalance > 0 ? `<button class="action-pay-emi px-2.5 py-1 rounded-lg bg-sky-600/20 text-sky-400 hover:bg-sky-600 hover:text-white border border-sky-500/30 text-xs font-semibold transition" data-id="${loan.id}">Pay EMI</button>` : `<span class="px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold">Cleared</span>`}
        </div>`).join('');
    }

    function resetPaginationAndRender() { txRenderLimit = 20; renderTransactions(); }
    function loadMoreTransactions() { txRenderLimit += 20; renderTransactions(); }

    function renderTransactions() {
      const container = document.getElementById('fullTxList');
      const searchQuery = (document.getElementById('txSearchInput')?.value || '').toLowerCase();
      const filterType = document.getElementById('txFilterType')?.value || 'all';
      
      const fromDate = document.getElementById('txFilterFrom')?.value;
      const toDate = document.getElementById('txFilterTo')?.value;

      let filtered = [...appData.transactions].filter(t => {
        if (filterType !== 'all' && t.type !== filterType) return false;
        if (searchQuery && !(t.notes || '').toLowerCase().includes(searchQuery) && !(t.category || '').toLowerCase().includes(searchQuery)) return false;
        if (fromDate && t.date < fromDate) return false;
        if (toDate && t.date > toDate) return false;
        return true;
      });

      filtered.sort((a,b) => new Date(b.date) - new Date(a.date));
      if (!document.getElementById('chartContainer').classList.contains('hidden')) updateTxChart(filtered);

      if (filtered.length === 0) container.innerHTML = `<div class="p-8 text-center text-xs text-slate-500">No transactions found for this range.</div>`;
      else {
        const paginated = filtered.slice(0, txRenderLimit);
        let html = paginated.map(t => createTxRowHtml(t, true)).join('');
        if (filtered.length > txRenderLimit) html += `<button id="btn-load-more-tx" class="w-full py-2.5 mt-2 text-xs font-bold text-slate-400 bg-slate-800/50 hover:bg-slate-800 rounded-xl border border-slate-700 transition">Load More (${filtered.length - txRenderLimit} remaining)</button>`;
        container.innerHTML = html;
      }
      renderIcons();
    }

          <div class="flex items-center gap-3">

    function toggleTxChart() {
      const container = document.getElementById('chartContainer');
      container.classList.toggle('hidden');

    function updateTxChart(filtered) {
      if (typeof Chart === 'undefined') return;
      const ctx = document.getElementById('txChartCanvas');
      if (!ctx) return;
      const chartType = document.getElementById('txFilterType').value;
      const dataToChart = filtered.filter(t => chartType === 'income' ? t.type === 'income' : t.type === 'expense');
      const dataMap = {};
      dataToChart.forEach(t => { dataMap[t.category] = (dataMap[t.category] || 0) + Number(t.amount); });
      if (txChartInstance) txChartInstance.destroy();
      txChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: { labels: Object.keys(dataMap), datasets: [{ data: Object.values(dataMap), backgroundColor: ['#f43f5e', '#ec4899', '#d946ef', '#a855f7', '#8b5cf6', '#6366f1', '#3b82f6', '#0ea5e9', '#06b6d4', '#14b8a6'], borderWidth: 0, hoverOffset: 4 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#cbd5e1', font: { size: 10 } } }, tooltip: { callbacks: { label: function(context) { return ' ₹' + context.raw.toLocaleString('en-IN'); } } } } }
      });
    }

    function openAccountModal() {
      document.getElementById('accEditId').value = ''; 
      document.getElementById('accName').value = ''; 
      document.getElementById('accBalance').value = ''; 
      document.getElementById('cardDue').value = ''; 
      document.getElementById('cardStatement').value = '';
      document.getElementById('cardLimit').value = '';

    function editAccount(id) {
      const acc = appData.accounts.find(a => a.id === id);
      if (!acc) return;
      document.getElementById('accEditId').value = acc.id;
      document.getElementById('accType').value = acc.type;
      document.getElementById('accName').value = acc.name;
      
      if (acc.type === 'credit_card') {
        document.getElementById('cardLimit').value = acc.limit;
        document.getElementById('cardDue').value = acc.currentDue;
        document.getElementById('cardStatement').value = acc.statementBalance !== undefined ? acc.statementBalance : acc.currentDue;
        document.getElementById('cardDueDay').value = acc.dueDay || 15;
        document.getElementById('cardBillGenDay').value = acc.billGenDay || 1;
      } else {
        document.getElementById('accBalance').value = acc.balance;
      }
      toggleAccountFields(); 
      openModal('accountModal');
    }

    function handleSaveAccount(e) {
      e.preventDefault();
      const editId = document.getElementById('accEditId').value;
      const type = document.getElementById('accType').value;
      const name = document.getElementById('accName').value.trim();
      if (!name) return;

      if (editId) {
        const acc = appData.accounts.find(a => a.id === editId);
        if (acc) {
          acc.name = name;
          acc.type = type;
          if (type === 'credit_card') {
            acc.limit = parseFloat(document.getElementById('cardLimit').value) || 0;
            acc.currentDue = parseFloat(document.getElementById('cardDue').value) || 0; 
            let stmtVal = document.getElementById('cardStatement').value;
            acc.statementBalance = stmtVal !== '' ? parseFloat(stmtVal) : acc.currentDue;
            acc.dueDay = parseInt(document.getElementById('cardDueDay').value) || 15;
            acc.billGenDay = parseInt(document.getElementById('cardBillGenDay').value) || 1;
          } else {
            acc.balance = parseFloat(document.getElementById('accBalance').value) || 0;
          }
        }
      } else {
        const newAcc = { id: 'acc_' + Date.now(), name, type };
        if (type === 'credit_card') {
          newAcc.limit = parseFloat(document.getElementById('cardLimit').value) || 0;
          newAcc.currentDue = parseFloat(document.getElementById('cardDue').value) || 0; 
          let stmtVal = document.getElementById('cardStatement').value;
          newAcc.statementBalance = stmtVal !== '' ? parseFloat(stmtVal) : newAcc.currentDue;
          newAcc.dueDay = parseInt(document.getElementById('cardDueDay').value) || 15;
          newAcc.billGenDay = parseInt(document.getElementById('cardBillGenDay').value) || 1;
          newAcc.lastBilledMonth = '';
          newAcc.lastPaidMonth = '';
        } else {
          newAcc.balance = parseFloat(document.getElementById('accBalance').value) || 0;
        }
        appData.accounts.push(newAcc); 
      }
      saveData(true); 
      closeModal('accountModal');
      showToast('Account saved successfully');
    }

    function deleteAccount(id) {
      if (appData.accounts.length <= 1) { alert("You must keep at least one account."); return; }
      if (appData.transactions.some(t => t.accountId === id)) { alert("Cannot delete account. It is linked to existing transactions."); return; }
      if(confirm('Delete this account?')) {
        appData.accounts = appData.accounts.filter(a => a.id !== id); 
        saveData(true);
        showToast('Account deleted');
      }
    }

    function exportDataJSON() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `PocketLedger_Backup_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 60000);
      showToast('Data exported successfully');
    }

    function exportDataCSV() {
      let csv = "Date,Type,Category,Amount,Account,Notes\n";
      appData.transactions.forEach(t => {
          const acc = appData.accounts.find(a => a.id === t.accountId);
          csv += `${t.date},${t.type},"${t.category}",${t.amount},"${acc ? acc.name : 'Unknown'}","${t.notes ? t.notes.replace(/"/g, '""') : ''}"\n`;
      });
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `PocketLedger_Transactions_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a); a.click(); setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 60000);
      showToast('CSV downloaded');
    }

    function importDataJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && parsed.accounts && parsed.transactions) {
            
            if (importMode === 'overwrite') {
              appData = parsed; 
              saveData(true); closeModal('settingsModal'); 
              showToast("Backup restored completely!");
            } else if (importMode === 'merge') {
              
              const mergeArrays = (baseArr, newArr) => {
                if(!newArr) return baseArr;
                const map = new Map(baseArr.map(item => [item.id, item]));
                newArr.forEach(item => map.set(item.id, item)); 
                return Array.from(map.values());
              };

              const existingTxIds = new Set(appData.transactions.map(t => t.id));
              const newImportedTxs = (parsed.transactions || []).filter(t => !existingTxIds.has(t.id));

              const localAccountsMap = new Map(appData.accounts.map(a => [a.id, a]));
              (parsed.accounts || []).forEach(importAcc => {
                if (!localAccountsMap.has(importAcc.id)) {
                  localAccountsMap.set(importAcc.id, importAcc);
                }
              });
              appData.accounts = Array.from(localAccountsMap.values());

              newImportedTxs.forEach(tx => {
                const acc = appData.accounts.find(a => a.id === tx.accountId);
                if (acc) {
                  if (acc.type === 'credit_card') {
                    if (tx.type === 'expense') acc.currentDue += Number(tx.amount);
                    else acc.currentDue = Math.max(0, acc.currentDue - Number(tx.amount));
                  } else {
                    if (tx.type === 'expense') acc.balance -= Number(tx.amount);
                    else acc.balance += Number(tx.amount);
                  }
                }
              });
              
              appData.transactions = mergeArrays(appData.transactions, parsed.transactions);
              appData.khata = mergeArrays(appData.khata, parsed.khata);
              appData.loans = mergeArrays(appData.loans, parsed.loans);
              appData.investments = mergeArrays(appData.investments, parsed.investments);
              appData.insurances = mergeArrays(appData.insurances, parsed.insurances);
              appData.bills = mergeArrays(appData.bills || [], parsed.bills || []);
              
              if (parsed.categories) {
                appData.categories.expense = [...new Set([...appData.categories.expense, ...(parsed.categories.expense || [])])];
                appData.categories.income = [...new Set([...appData.categories.income, ...(parsed.categories.income || [])])];
              }
              appData.dismissedAlerts = { ...appData.dismissedAlerts, ...(parsed.dismissedAlerts || {}) };

              saveData(true); closeModal('settingsModal'); 
              showToast("Smart Sync completed successfully!");
            }
          } else alert("Invalid backup format.");
        } catch (err) { alert("Error parsing backup file."); }
        document.getElementById('importJsonFileInput').value = '';
      };
      reader.readAsText(file);
    }

    function clearAllData() {
      if (confirm("Reset all data to default? This cannot be undone.")) {
        appData = JSON.parse(JSON.stringify(defaultSeedData)); saveData(true); closeModal('settingsModal');
        showToast("App reset successfully");
      }
    }

    function processPayment(e) {
      e.preventDefault();
      if (!pendingPayment) return;
      const amount = parseFloat(document.getElementById('payAmount').value);
      const sourceAcc = appData.accounts.find(a => a.id === document.getElementById('paySourceAccount').value);
      if (!sourceAcc || isNaN(amount) || amount <= 0) return;

      const paymentDate = getLocalISOString();
      const currentMonthKey = paymentDate.slice(0, 7);

      if (pendingPayment.type === 'emi') {
        const loan = appData.loans.find(l => l.id === pendingPayment.id);
        if (!loan) return;
        let interestPart = 0, principalPart = loan.emiAmount;
        if (loan.interestRate > 0) { interestPart = loan.principalBalance * ((loan.interestRate / 100) / 12); principalPart = Math.max(0, loan.emiAmount - interestPart); }
        loan.principalBalance = Math.max(0, loan.principalBalance - principalPart);
        loan.lastPaidMonth = currentMonthKey;
        sourceAcc.balance = Math.max(0, sourceAcc.balance - loan.emiAmount);
        appData.transactions.unshift({ id: 'tx_' + Date.now(), type: 'expense', amount: loan.emiAmount, category: 'Utilities & Bills', accountId: sourceAcc.id, date: paymentDate, notes: `EMI: ${loan.name} (Prin: ₹${principalPart.toFixed(0)}, Int: ₹${interestPart.toFixed(0)})` });

      } else if (pendingPayment.type === 'cc') {
        const card = appData.accounts.find(a => a.id === pendingPayment.id);
        if (!card) return;
        card.currentDue = Math.max(0, card.currentDue - amount);
        card.statementBalance = Math.max(0, (card.statementBalance || 0) - amount);
        if (card.statementBalance === 0) card.lastPaidMonth = currentMonthKey;
        sourceAcc.balance = Math.max(0, sourceAcc.balance - amount);
        appData.transactions.unshift({ id: 'tx_' + Date.now(), type: 'expense', amount: amount, category: 'Utilities & Bills', accountId: sourceAcc.id, date: paymentDate, notes: `Card Bill Payment: ${card.name}` });

      } else if (pendingPayment.type === 'bill') {
        const bill = appData.bills.find(b => b.id === pendingPayment.id);
        if (!bill) return;
        bill.lastPaidMonth = currentMonthKey;
        sourceAcc.balance = Math.max(0, sourceAcc.balance - amount);
        appData.transactions.unshift({ id: 'tx_' + Date.now(), type: 'expense', amount: amount, category: 'Utilities & Bills', accountId: sourceAcc.id, date: paymentDate, notes: `Recurring Bill: ${bill.title}` });
        
      } else if (pendingPayment.type === 'sip') {
        const inv = appData.investments.find(i => i.id === pendingPayment.id);
        if (!inv) return;
        inv.lastPaidMonth = currentMonthKey;
        inv.amount += amount; 
        sourceAcc.balance = Math.max(0, sourceAcc.balance - amount);
        appData.transactions.unshift({ 
            id: 'tx_' + Date.now(), type: 'expense', amount: amount, 
            category: 'Investments', accountId: sourceAcc.id, 
            date: paymentDate, 
            notes: `SIP/RD Installment: ${inv.name}` 
        });
      }
      
      pendingPayment = null; 
      saveData(true); 
      closeModal('paymentModal');
      showToast('Payment recorded successfully');
    }

    function handleSaveInvestment(e) {
      e.preventDefault();
      const editId = document.getElementById('invEditId').value;
      const type = document.getElementById('invType').value;
      const name = document.getElementById('invName').value.trim();
      const amount = parseFloat(document.getElementById('invAmount').value);
      const installmentAmount = parseFloat(document.getElementById('invInstallment').value) || 0;
      const dueDay = parseInt(document.getElementById('invDueDay').value) || null;

      if (!name || isNaN(amount)) return;

      if (editId) {
        const inv = appData.investments.find(i => i.id === editId);
        if (inv) {
          inv.type = type;
          inv.name = name;
          inv.amount = amount;
          inv.installmentAmount = installmentAmount;
          inv.dueDay = dueDay;
        }
      } else {
        appData.investments.push({
          id: 'inv_' + Date.now(),
          type,
          name,
          amount,
          installmentAmount,
          dueDay,
          lastPaidMonth: ''
        });
      }

      saveData(true);
      closeModal('investmentModal');
      showToast('Investment saved');
    }

    function editInvestment(id) {
      const inv = appData.investments.find(i => i.id === id);
      if (!inv) return;
      document.getElementById('invEditId').value = inv.id;
      document.getElementById('invModalTitle').innerText = 'Edit Investment';
      document.getElementById('invType').value = inv.type;
      document.getElementById('invName').value = inv.name;
      document.getElementById('invAmount').value = inv.amount;
      document.getElementById('invInstallment').value = inv.installmentAmount || '';
      document.getElementById('invDueDay').value = inv.dueDay || '';
      openModal('investmentModal');
    }

    function safeBindEvent(id, eventType, callback) {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener(eventType, callback);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      
      const dayOptions = Array.from({ length: 31 }, (_, i) => `<option value="${i+1}">${i+1}th of month</option>`).join('');
      if (document.getElementById('loanDueDay')) document.getElementById('loanDueDay').innerHTML = dayOptions;
      if (document.getElementById('cardDueDay')) document.getElementById('cardDueDay').innerHTML = dayOptions;
      if (document.getElementById('cardBillGenDay')) document.getElementById('cardBillGenDay').innerHTML = dayOptions;
      if (document.getElementById('billDueDay')) document.getElementById('billDueDay').innerHTML = dayOptions;
      if (document.getElementById('invDueDay')) document.getElementById('invDueDay').innerHTML = `<option value="">None (Lumpsum only)</option>` + dayOptions;

      const todayLocal = new Date();
      const pad = function(n) { return String(n).padStart(2, '0'); };
      const firstDay = todayLocal.getFullYear() + '-' + pad(todayLocal.getMonth() + 1) + '-01';
      const lastDateObj = new Date(todayLocal.getFullYear(), todayLocal.getMonth() + 1, 0);
      const lastDay = todayLocal.getFullYear() + '-' + pad(todayLocal.getMonth() + 1) + '-' + pad(lastDateObj.getDate());
      
      if (document.getElementById('txFilterFrom')) document.getElementById('txFilterFrom').value = firstDay;
      if (document.getElementById('txFilterTo')) document.getElementById('txFilterTo').value = lastDay;

      checkCreditCardBills(); 
      refreshAllViews();

      safeBindEvent('txForm', 'submit', handleSaveTransaction);
      safeBindEvent('khataForm', 'submit', handleSaveKhata);
      safeBindEvent('loanForm', 'submit', handleSaveLoan);
      safeBindEvent('investmentForm', 'submit', handleSaveInvestment);
      safeBindEvent('insuranceForm', 'submit', handleSaveInsurance);
      safeBindEvent('accountForm', 'submit', handleSaveAccount);
      safeBindEvent('billForm', 'submit', handleSaveBill);
      safeBindEvent('paymentForm', 'submit', processPayment);

      safeBindEvent('txSearchInput', 'input', resetPaginationAndRender);
      safeBindEvent('txFilterType', 'change', resetPaginationAndRender);
      safeBindEvent('txFilterFrom', 'change', resetPaginationAndRender);
      safeBindEvent('txFilterTo', 'change', resetPaginationAndRender);
      safeBindEvent('txCategory', 'change', handleCategoryChange);
      safeBindEvent('accType', 'change', toggleAccountFields);
      safeBindEvent('importJsonFileInput', 'change', importDataJSON);

      document.addEventListener('click', (e) => {
        const target = e.target.closest('button, .clickable, .close-modal-btn, .action-toggle-reminders');
        if (!target) return;

        if (target.classList.contains('close-modal-btn')) return closeModal(target.dataset.target);

        if (target.classList.contains('action-toggle-reminders')) return toggleRemindersModal();
        if (target.classList.contains('action-dismiss-reminder')) return dismissReminder(target.dataset.id);
        if (target.classList.contains('action-pay-emi')) return openPaymentModal('emi', target.dataset.id);
        if (target.classList.contains('action-pay-cc')) return openPaymentModal('cc', target.dataset.id);
        if (target.classList.contains('action-pay-bill')) return openPaymentModal('bill', target.dataset.id);
        if (target.classList.contains('action-pay-sip')) return openPaymentModal('sip', target.dataset.id);
        
        if (target.classList.contains('action-edit-tx')) return editTransaction(target.dataset.id);
        if (target.classList.contains('action-delete-tx')) return deleteTransaction(target.dataset.id);
        if (target.classList.contains('action-open-contact')) return openContactStatement(target.dataset.name);
        if (target.classList.contains('action-edit-khata')) return editKhataEntry(target.dataset.id);
        if (target.classList.contains('action-delete-khata')) return deleteKhata(target.dataset.id);
        if (target.classList.contains('action-edit-loan')) return editLoan(target.dataset.id);
        if (target.classList.contains('action-delete-loan')) return deleteLoan(target.dataset.id);
        if (target.classList.contains('action-edit-inv')) return editInvestment(target.dataset.id);
        if (target.classList.contains('action-delete-inv')) return deleteInvestment(target.dataset.id);
        if (target.classList.contains('action-edit-ins')) return editInsurance(target.dataset.id);
        if (target.classList.contains('action-delete-ins')) return deleteInsurance(target.dataset.id);
        
        if (target.classList.contains('action-edit-acc')) return editAccount(target.dataset.id);
        if (target.classList.contains('action-delete-acc')) return deleteAccount(target.dataset.id);
        
        if (target.classList.contains('action-edit-bill')) return editBill(target.dataset.id);
        if (target.classList.contains('action-delete-bill')) return deleteBill(target.dataset.id);
        
        if (target.id === 'btn-load-more-tx') return loadMoreTransactions();
        if (target.id === 'btn-reminders') return toggleRemindersModal();
        if (target.id === 'btn-settings') return openSettingsModal();
        
        if (target.id === 'btn-dash-assets') return switchTab('assets');
        if (target.id === 'btn-dash-loans' || target.id === 'btn-view-all-loans') return switchTab('loans');
        if (target.id === 'btn-dash-khata-lent') { switchTab('khata'); return setKhataFilter('lent'); }
        if (target.id === 'btn-dash-khata-borrowed') { switchTab('khata'); return setKhataFilter('borrowed'); }
        if (target.id === 'btn-add-expense' || target.id === 'btn-view-add-tx') return openTransactionModal('expense');
        if (target.id === 'btn-add-income') return openTransactionModal('income');
        if (target.id === 'btn-add-khata' || target.id === 'btn-view-add-khata') return openKhataModal();
        if (target.id === 'btn-view-all-tx') return switchTab('transactions');
        if (target.id === 'btn-toggle-chart') return toggleTxChart();
        
        if (target.id === 'tabKhataAll') return setKhataFilter('all');
        if (target.id === 'tabKhataLent') return setKhataFilter('lent');
        if (target.id === 'tabKhataBorrowed') return setKhataFilter('borrowed');
        
        if (target.id === 'btn-view-add-loan') return openLoanModal();
        if (target.id === 'btn-view-add-account') return openAccountModal();
        if (target.id === 'btn-view-add-investment') return openInvestmentModal();
        if (target.id === 'btn-view-add-insurance') return openInsuranceModal();
        if (target.id === 'btn-view-add-bill') return openBillModal();
        
        if (target.id === 'btnTxTypeExpense') return setTxType('expense');
        if (target.id === 'btnTxTypeIncome') return setTxType('income');
        if (target.id === 'btnKhataLent') return setKhataDirection('lent');
        if (target.id === 'btnKhataBorrowed') return setKhataDirection('borrowed');
        
        if (target.id === 'btn-settings-export-json') return exportDataJSON();
        if (target.id === 'btn-settings-export-csv') return exportDataCSV();
        if (target.id === 'btn-settings-import-merge') { importMode = 'merge'; return document.getElementById('importJsonFileInput').click(); }
        if (target.id === 'btn-settings-import-overwrite') { importMode = 'overwrite'; return document.getElementById('importJsonFileInput').click(); }
        if (target.id === 'btn-settings-reset') return clearAllData();
        
        if (target.id && target.id.startsWith('nav-')) return switchTab(target.id.replace('nav-', ''));
      });

      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('/kanakku_pusthakam/sw.js').catch(() => console.log('SW skipped.'));
      }
    });
  </script>
